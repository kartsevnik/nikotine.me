<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Resume — Nikolay</title>
  <meta name="description"
    content="Work experience, skills and professional background of Nikolay — Power Platform and web developer." />
  <meta name="theme-color" content="#0a0b0f" />
  <meta property="og:title" content="Resume — Nikolay" />
  <meta property="og:description"
    content="Work experience, skills and professional background of Nikolay — Power Platform and web developer." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://nikotine.me/resume.html" />
  <meta property="og:image" content="assets/logo.png" />
  <script>
    (function () {
      var supported = ["it", "en", "ru", "uk"];
      var language = "";
      try {
        language = localStorage.getItem("siteLanguage") || "";
      } catch (_error) {}
      if (!supported.includes(language)) {
        var browserLanguages = navigator.languages?.length
          ? navigator.languages
          : [navigator.language];
        language =
          browserLanguages
            .map(function (value) { return String(value || "").toLowerCase().split("-")[0]; })
            .find(function (value) { return supported.includes(value); }) || "en";
      }
      window.__initialLanguage = language;
      document.documentElement.lang = language;
      document.documentElement.classList.add("i18n-pending");
      window.setTimeout(function () {
        document.documentElement.classList.remove("i18n-pending");
      }, 2000);
    })();
  </script>
  <style>.i18n-pending body { visibility: hidden; }</style>
  <noscript><style>body { visibility: visible !important; }</style></noscript>
  <link rel="icon" type="image/png" href="assets/favicon.png" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@500;600&family=Manrope:wght@300;400;500;600&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/content-page.css" />
</head>

<body data-page="resume">
  <div class="bg" aria-hidden="true">
    <div class="bg__grid"></div>
    <div class="bg__glow bg__glow--top"></div>
    <div class="bg__glow bg__glow--bottom"></div>
    <div class="bg__lines"></div>
  </div>

  <main class="content-page">
    <nav class="content-nav" aria-label="Page navigation">
      <a class="content-nav__brand" href="index.html" aria-label="Back to Nikolay home page">
        <img src="assets/logo.png" alt="" width="42" height="42" />
        <span>Nikolay</span>
      </a>
      <div class="content-nav__actions">
        <a class="text-link" href="index.html">← Back home</a>
        <div class="language-menu" data-language-menu>
          <button
            class="language-menu__trigger"
            type="button"
            aria-label="Language selector"
            aria-haspopup="true"
            aria-expanded="false"
          >
            <span data-language-current>EN</span>
            <span class="language-menu__chevron" aria-hidden="true"></span>
          </button>
          <div class="language-menu__options" role="group" aria-label="Language selector" hidden>
            <button type="button" data-language="it" aria-label="Italiano">IT</button>
            <button type="button" data-language="en" aria-label="English">EN</button>
            <button type="button" data-language="ru" aria-label="Русский">RU</button>
            <button type="button" data-language="uk" aria-label="Українська">UA</button>
          </div>
        </div>
      </div>
    </nav>

    <div class="resume-summary">
      <header class="content-hero content-hero--resume">
        <h1>Resume</h1>
        <div data-resume-hero-lead class="content-hero__lead-wrap">
          <p class="content-hero__lead">
            Software Developer with experience in Microsoft Dynamics 365 and Power Platform solutions.
          </p>
        </div>
        <div id="resume-hero-extras"></div>
      </header>

      <section id="resume-skills-root" class="resume-skills" aria-labelledby="skills"></section>
    </div>

    <hr class="resume-divider" aria-hidden="true" />

    <div id="resume-root" class="resume-root"></div>

    <footer class="content-footer">
      <p class="content-footer__text">nikotine.me</p>
    </footer>
  </main>

  <script src="js/resume-content-en.js"></script>
  <script src="js/resume-content-it.js"></script>
  <script src="js/resume-content-ru.js"></script>
  <script src="js/resume-content-uk.js"></script>
  <script src="js/resume-content.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/portfolio-gallery.js"></script>
  <script src="js/portfolio-images.js"></script>
  <script src="js/resume-pdf.js"></script>
  <script src="js/resume.js"></script>
</body>

</html>
