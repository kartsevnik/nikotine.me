<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nikolay — Developer, Creator &amp; Explorer</title>
  <meta name="description"
    content="Professional profile of Nikolay — Power Platform and web developer. Resume, services, contacts and projects." />
  <meta name="theme-color" content="#0a0b0f" />
  <meta property="og:title" content="Nikolay — Developer, Creator &amp; Explorer" />
  <meta property="og:description"
    content="Professional profile of Nikolay — Power Platform and web developer. Resume, services, contacts and projects." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://nikotine.me/" />
  <meta property="og:image" content="assets/logo.png" />
  <script>
    (function () {
      var supported = ["it", "en", "ru", "uk"];
      var language = "";
      try {
        language = localStorage.getItem("siteLanguage") || "";
      } catch (_error) {}
      if (!supported.includes(language)) {
        var browserLanguages = navigator.languages?.length
          ? navigator.languages
          : [navigator.language];
        language =
          browserLanguages
            .map(function (value) { return String(value || "").toLowerCase().split("-")[0]; })
            .find(function (value) { return supported.includes(value); }) || "en";
      }
      window.__initialLanguage = language;
      document.documentElement.lang = language;
      document.documentElement.classList.add("i18n-pending");
    })();
  </script>
  <style>.i18n-pending body { visibility: hidden; }</style>
  <noscript><style>body { visibility: visible !important; }</style></noscript>
  <link rel="icon" type="image/png" href="assets/favicon.png" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@500;600&family=Manrope:wght@300;400;500;600&display=block"
    rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>

<body data-page="home" data-defer-i18n-boot>
  <div class="bg" aria-hidden="true">
    <div class="bg__grid"></div>
    <div class="bg__glow bg__glow--top"></div>
    <div class="bg__glow bg__glow--bottom"></div>
    <div class="bg__lines"></div>
  </div>

  <main class="page">
    <div class="page-tools">
      <div class="language-menu" data-language-menu>
        <button
          class="language-menu__trigger"
          type="button"
          aria-label="Language selector"
          aria-haspopup="true"
          aria-expanded="false"
        >
          <span data-language-current>EN</span>
          <span class="language-menu__chevron" aria-hidden="true"></span>
        </button>
        <div class="language-menu__options" role="group" aria-label="Language selector" hidden>
          <button type="button" data-language="it" aria-label="Italiano">IT</button>
          <button type="button" data-language="en" aria-label="English">EN</button>
          <button type="button" data-language="ru" aria-label="Русский">RU</button>
          <button type="button" data-language="uk" aria-label="Українська">UA</button>
        </div>
      </div>
    </div>

    <header class="hero">
      <div class="hero__layout">
        <div class="hero__side hero__side--start">
          <h1 class="hero__name">Nikolay Kartsev</h1>
        </div>
        <div class="hero__logo-wrap">
          <img class="hero__logo" src="assets/logo.png" alt="Nikolay logo — letter N" width="80" height="80" />
        </div>
        <div class="hero__side hero__side--end">
          <p class="hero__tagline">Developer · Creator · Explorer</p>
        </div>
        <p class="hero__slogan">
          Build with purpose. Create with freedom. Explore without limits.
        </p>
      </div>
      <div class="hero__ornament" aria-hidden="true">
        <span class="hero__ornament-mark"></span>
      </div>
    </header>

    <section class="section section--contacts" aria-labelledby="contacts-title">
      <h2 id="contacts-title" class="section__title">Contacts</h2>
      <div id="contacts-list" class="contacts contacts--row-4" role="list"></div>
    </section>

    <section class="section section--work" aria-labelledby="work-title">
      <h2 id="work-title" class="section__title">Work &amp; Expertise</h2>
      <div id="work-list" class="projects projects--row-3" role="list"></div>
    </section>

    <section class="section section--sup-services" aria-labelledby="sup-services-title">
      <h2 id="sup-services-title" class="section__title">SUP Services</h2>
      <div id="sup-services-list" class="projects" role="list"></div>
    </section>

    <section class="section section--creative" aria-labelledby="creative-title">
      <h2 id="creative-title" class="section__title">Creative Projects</h2>
      <div id="creative-list" class="projects" role="list"></div>
    </section>

    <footer class="footer">
      <span class="footer__mark" aria-hidden="true">N</span>
      <p class="footer__text">nikotine.me</p>
    </footer>
  </main>

  <script src="js/config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/main.js"></script>
</body>

</html>
